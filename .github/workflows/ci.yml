name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gettext gjs libglib2.0-bin make python3 unzip zip

      - name: Validate sources
        run: |
          glib-compile-schemas --strict --dry-run schemas
          gjs -m tests/folders.test.js
          python3 tests/layout.test.py

      - name: Build extension archive
        run: bash package-erhai.sh "$GITHUB_WORKSPACE/dist"

      - name: Verify required archive contents
        run: |
          archive=dist/glasslight-erhai.shell-extension.zip
          unzip -Z1 "$archive" | grep -Fx extension.js
          unzip -Z1 "$archive" | grep -Fx src/shared/i18n.js
          unzip -Z1 "$archive" | grep -Fx schemas/gschemas.compiled
          unzip -Z1 "$archive" | grep -Fx locale/ru/LC_MESSAGES/glasslight.mo
